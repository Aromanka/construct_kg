llm:
  provider: deepseek
  model: deepseek-v4-pro
  api_key: ${DEEPSEEK_API_KEY}
  base_url: https://api.deepseek.com
  temperature: 0.0
  timeout: 120

processing:
  job_claimers: 8
  job_concurrency: 100
  api_concurrency: 100
  chunk_queue_size: 300
  requests_per_minute: 100
  tokens_per_minute: 1000000
  reserved_output_tokens: 4096
  distributed_rate_limit: true
  max_retries: 4
  request_timeout: 120
  retry_backoff: 2.0
  job_lease_seconds: 900
  heartbeat_interval: 30

database:
  path: data/medical_kg.sqlite3
  timeout: 30
  echo: false

extraction:
  passes:
    - general
    - molecular
    - clinical
  stage_version: extract:v1
  code_version: 0.1.0

relations:
  vocabulary_file: config/relations.yaml

prompts:
  directory: prompts

logging:
  level: INFO
  json: true
