schema_version: pnet-graph-v1
layers:
- id: step_000
  order: 0
- id: step_001
  order: 1
- id: step_002
  order: 2
- id: step_003
  order: 3
- id: step_004
  order: 4
- id: step_005
  order: 5
- id: step_006
