nodes_file: nodes.tsv
edges_file: edges.tsv
algorithm:
  name: bounded_bidirectional_corridor_pnet
  version: '1.0'
  max_layers: 8
  max_hops: 7
  corridor_rule: ds_plus_dt_le_h
